name: Update RuView submodule

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC (odd minute avoids GitHub's top-of-hour congestion)
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update RuView and ruvector to latest upstream main
        run: git submodule update --remote RuView ruvector

      - name: Commit, push, and trigger a rebuild if either submodule moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet RuView ruvector; then
            echo "Submodules already up to date — nothing to rebuild."
            exit 0
          fi
          RV_DESC=$(git -C RuView describe --tags --always)
          RVEC_SHA=$(git -C ruvector rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RuView ruvector
          git commit -m "Bump submodules: RuView ${RV_DESC}, ruvector ${RVEC_SHA}"
          git push
          # CRITICAL: the push above is authenticated with GITHUB_TOKEN, and GitHub deliberately
          # does NOT start `push`-triggered workflows from a GITHUB_TOKEN push (anti-recursion).
          # So the rebuild would never fire on its own. workflow_dispatch IS exempt from that rule,
          # so explicitly dispatch rebuild-kb here — this is what makes the KBs actually rebuild
          # and republish on every real submodule bump.
          echo "Submodules moved — dispatching rebuild-kb.yml…"
          gh workflow run rebuild-kb.yml --ref main
