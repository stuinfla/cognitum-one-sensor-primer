name: Rebuild RVF knowledge bases

# ─────────────────────────────────────────────────────────────────────────────
# EVERGREEN KB AUTOMATION
#
# The companion "Update RuView submodule" workflow bumps the RuView / ruvector
# submodule POINTERS once a day. That bump commit touches the `RuView` / `ruvector`
# gitlink paths — which triggers THIS workflow. So: upstream moves -> daily bump ->
# this rebuilds the KBs from the new checkout, guards them, regenerates the download
# bundles, COMMITS the (sub-100MB) loose KB files, and PUBLISHES the bundles as assets
# on the rolling `kb-latest` GitHub Release.
#
# WHY a Release (not committed zips): the combined bundle for ruvector is ~155MB — over
# GitHub's 100MB per-file repo limit. The loose files in kb/stores/<repo>/ are each <100MB
# and ARE committed (source of truth); the large download zips are gitignored and live on
# the `kb-latest` Release, whose URL is permanent so the website + self-updater never break.
#
# Two jobs:
#   • rebuild-small  — AUTOMATIC on every submodule bump (+ manual). The 384-dim MiniLM
#                      variant is the Seed default and FAST (minutes) on the free runner.
#   • rebuild-big    — workflow_dispatch ONLY. The 768-dim BGE variant re-embeds ~36k
#                      passages on CPU (>1h on a free 2-core runner) — too slow to automate.
#
# NOTE on variant skew: an automatic small-only rebuild refreshes the small .rvf; the big
# .rvf in the bundle then reflects the LAST manual big build until rebuild-big is run again.
# Both variants are always present in the bundle; big simply trails small between manual runs.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    paths:
      - 'RuView'      # submodule gitlink — moves when the daily bump points it at a new SHA
      - 'ruvector'
  workflow_dispatch:
    inputs:
      rebuild_big:
        description: 'Also rebuild the BIG (768-dim) variant (SLOW, manual only — needs a heavier runner).'
        type: boolean
        default: false

# contents:write covers BOTH committing the loose KB files AND uploading Release assets
# (gh release upload authenticates with the built-in GITHUB_TOKEN).
permissions:
  contents: write

concurrency:
  group: rebuild-kb-${{ github.workflow }}
  cancel-in-progress: true

env:
  KB_MODEL_CACHE: ${{ github.workspace }}/kb/models-cache
  EMBED_MODEL: Xenova/all-MiniLM-L6-v2

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # SMALL variant — evergreen, always-on. Fast + Seed-critical.
  # ═══════════════════════════════════════════════════════════════════════════
  rebuild-small:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # @ruvector/rvf resolves through @ruvector/rvf-node (linux-x64-gnu prebuilt) — no native build.
      - name: Install KB deps
        working-directory: kb
        run: npm i @ruvector/rvf @xenova/transformers

      - name: Cache MiniLM model
        uses: actions/cache@v4
        with:
          path: ${{ env.KB_MODEL_CACHE }}
          key: minilm-${{ env.EMBED_MODEL }}-v1

      # Build scripts now write into kb/stores/<repo>/ as <repo>-kb.small.rvf (two-variant layout).
      - name: Rebuild ruvector KB (small)
        env:
          KB_REPO_ROOT: ${{ github.workspace }}
        run: node kb/.build-ruvector-kb/build.mjs

      - name: Rebuild RuView KB (small)
        env:
          KB_REPO_ROOT: ${{ github.workspace }}
        run: node kb/build-ruview-kb.mjs

      # OPTIONAL LLM-authored primer PROSE regeneration — SKIPPED unless ANTHROPIC_API_KEY is set.
      # ┌─ ACTION REQUIRED BY A HUMAN ────────────────────────────────────────────────┐
      # │ To enable: Repo Settings -> Secrets and variables -> Actions -> New secret    │
      # │ named ANTHROPIC_API_KEY. Not fabricated here. Until then this step no-ops.     │
      # └────────────────────────────────────────────────────────────────────────────┘
      - name: Regenerate primer prose (skipped unless ANTHROPIC_API_KEY is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "ANTHROPIC_API_KEY present — primer-prose regeneration would run here."
          echo "TODO(other workstream): wire the real generator (e.g. node kb/generate-primer.mjs ruvector)."

      # Append the top-down primer sections INTO the freshly-built small .rvf (incremental,
      # parity-preserving) so the 6 comprehension-journey questions return whole sections.
      - name: Index primer orientation (ruvector)
        run: node kb/index-primer.mjs ruvector
      - name: Index primer orientation (RuView)
        run: node kb/index-primer.mjs ruview

      # ANTI-TRUNCATION GUARD — parity + truncation + live query on the SMALL build. Red => stop.
      - name: Guard — parity + anti-truncation + live query
        run: node kb/guard-check.mjs

      # Regenerate the download zips. make-bundles.mjs now ships BOTH variants when both are
      # present in stores/, deduping the shared passages — one bundle per repo.
      - name: Rebuild bundle zips
        run: node kb/make-bundles.mjs

      # Stamp the canonical build marker (kb/.last-built.json) + README provenance line.
      - name: Update README pins + write build marker
        run: node kb/update-readme-pins.mjs

      # Commit the LOOSE KB files (stores/*, manifests, SOURCE.json — all <100MB). The bundle
      # zips are gitignored (distributed via Release below), so `git add kb/` never stages them.
      - name: Commit rebuilt KB files
        run: |
          if git diff --quiet -- kb/; then echo "No KB changes to commit."; exit 0; fi
          RV_DESC=$(git -C RuView describe --tags --always || echo unknown)
          RVEC_SHA=$(git -C ruvector rev-parse --short HEAD || echo unknown)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/
          git commit -m "Rebuild KBs (small): RuView ${RV_DESC}, ruvector ${RVEC_SHA}"
          git push

      # Publish the refreshed bundles as assets on the rolling kb-latest Release (permanent URL).
      - name: Publish bundles to rolling kb-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kb-latest >/dev/null 2>&1 || \
            gh release create kb-latest --title "RVF Knowledge Bases — latest (rolling)" \
              --notes "Always-current Cognitum RVF KB bundles (big 768-dim + small 384-dim). CI refreshes these on upstream publish."
          gh release upload kb-latest kb/ruvector-kb-bundle.zip kb/ruview-kb-bundle.zip --clobber

  # ═══════════════════════════════════════════════════════════════════════════
  # BIG variant — MANUAL ONLY (workflow_dispatch, rebuild_big = true).
  # build-big-variant.mjs re-embeds ~36k passages with bge-base-en-v1.5 (768-dim, CLS) — CPU
  # bound, >1h on a free 2-core runner. Run it by hand on a larger/self-hosted runner when the
  # big variant needs refreshing. It writes <repo>-kb.big.rvf into kb/stores/<repo>/ and has its
  # OWN reconcile gate (vectors == passages, exit 1 on mismatch).
  # ═══════════════════════════════════════════════════════════════════════════
  rebuild-big:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_big }}
    runs-on: ubuntu-latest   # TODO(human): swap for a larger/self-hosted runner for real 36k runs.
    timeout-minutes: 350
    env:
      KB_MODEL_CACHE: ${{ github.workspace }}/kb/models-cache-big
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install KB deps
        working-directory: kb
        run: npm i @ruvector/rvf @xenova/transformers

      - name: Cache BGE model
        uses: actions/cache@v4
        with:
          path: ${{ env.KB_MODEL_CACHE }}
          key: bge-base-en-v1.5-v1

      # build-big-variant.mjs re-embeds the EXISTING passages (it does not re-walk the repo), so
      # the small build's passages must exist in stores/. Rebuild small first if they're missing.
      - name: Ensure small passages exist (re-embed source of truth)
        env:
          KB_REPO_ROOT: ${{ github.workspace }}
        run: |
          if [ ! -f kb/stores/ruvector/ruvector-kb.passages.jsonl ] || [ ! -f kb/stores/ruview/ruview-kb.passages.jsonl ]; then
            echo "Passages missing — rebuilding small variant first."
            node kb/.build-ruvector-kb/build.mjs
            node kb/build-ruview-kb.mjs
            node kb/index-primer.mjs ruvector && node kb/index-primer.mjs ruview
          fi

      # `both` = single-process embed + ingest over BOTH stores. Slow but simplest. For a faster
      # run on a multi-core runner, fan out `embed <store> <i> <n>` steps then `ingest <store>`.
      - name: Build BIG variant (both stores, 768-dim BGE)
        run: node kb/build-big-variant.mjs both

      # make-bundles.mjs ships BOTH variants from stores/ — one bundle per repo, big + small.
      - name: Rebuild bundle zips (big + small)
        run: node kb/make-bundles.mjs

      - name: Update README pins + write build marker
        run: node kb/update-readme-pins.mjs

      - name: Commit rebuilt KB files (loose; <100MB)
        run: |
          if git diff --quiet -- kb/; then echo "No KB changes to commit."; exit 0; fi
          RV_DESC=$(git -C RuView describe --tags --always || echo unknown)
          RVEC_SHA=$(git -C ruvector rev-parse --short HEAD || echo unknown)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/
          git commit -m "Rebuild KBs (big, manual): RuView ${RV_DESC}, ruvector ${RVEC_SHA}"
          git push

      - name: Publish bundles to rolling kb-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view kb-latest >/dev/null 2>&1 || \
            gh release create kb-latest --title "RVF Knowledge Bases — latest (rolling)" \
              --notes "Always-current Cognitum RVF KB bundles (big 768-dim + small 384-dim)."
          gh release upload kb-latest kb/ruvector-kb-bundle.zip kb/ruview-kb-bundle.zip --clobber
